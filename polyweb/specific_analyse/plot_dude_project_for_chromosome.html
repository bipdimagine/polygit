			function checkPassword(cookie_user, cookie_pwd) {
	    		dijit.byId('login').hide();
				document.getElementById("span_login").innerHTML = "<img src='../images/polyicons/wait18trans.gif' align='absmiddle'>";
				var this_username, this_pwd;
				if (cookie_user && cookie_pwd) {
					this_username = cookie_user;
					this_pwd = cookie_pwd;
				}
				else {
					this_username = document.getElementById("username").value;
					this_pwd = document.getElementById("passwd").value;
				}
				//var urlpasswd = url_listProject + "?type=login&pwd=" + this_pwd + "&login=" + this_username + "&action=check_have_projects";
	    		urlpasswd = url_path + "json_output_nodb/projects_json_output.pl?type=login&pwd=" + this_pwd + "&login=" + this_username;
			    $.getJSON( urlpasswd, function( data ) {
			    	var i = 0;
			    	$.each( data.results, function( key, val ) { i++; });
			    	if (i > 0) {
			    		document.getElementById("span_login").innerHTML = this_username;
			    		dijit.byId('waiting').hide();
			    		fill_grids_select_projects_patients(data.results);
			    	}
			    	else { error_login(); }
			    }).fail(function() { alert("ERROR: please contact bioinformatics platform"); });
			}
			
			function fill_grids_select_projects_patients(items) {
				let tableData_1 = [];
				items.sort((a, b) => b[0].localeCompare(a[0]));
				for (const hash_project of items) {
					//console.log(hash_project);
					const project_name = hash_project[0];
					const description = hash_project[1];
					const type = ''
					const genome = hash_project[5];
					
					var patients_b = hash_project[7];
					var is_NGS = project_name.match(/NGS20.*/);
					if (is_NGS) {
						const cmd_1 = "launch_plot('" + project_name + "', '" + patients_b + "');";
						const myOption_1 = document.createElement("span");
						let project_value_1 = "<div onClick=\"" + cmd_1 + "\"><b>" + project_name + "</b> <i>" + description + "</i> <span style='color:green;'>" + type + "</span> <span style='color:red;'>" + genome + "</span></div>";
						tableData_1.push({ project: project_value_1 });
						
					}
				}
				$('#project-select-1').bootstrapTable('load', tableData_1);
				
			}
			
			function launch_plot(project_name, patients) {
				document.getElementById('datas_container').innerHTML = "";
				document.getElementById('span_project').innerHTML = project_name + "<br><br>&#8595;";
	    		list_patients_names = patients.split(',');
	    		list_patients_names = list_patients_names.sort();
				for (i in list_patients_names) {
					launch_plot_patient_chr(project_name, i);
				}
			}
			
			function launch_plot_patient_chr(project_name, i) {
				var div_id = 'div_' + i;
				var patient_name = list_patients_names[i];
				var container = document.getElementById('datas_container');
				
				var newDiv = document.createElement('div');
				newDiv.id = div_id;
				newDiv.style.height = "300px";
				newDiv.style.width = "49%";
				newDiv.style.padding = "3px";
				newDiv.style.border = "solid 1px black";
				newDiv.className = "col-sm-6 col-md-6";
				container.appendChild(newDiv);
			
				var chr_name = document.getElementById('select_chr').value;
				if (chr_name == '0') { return; }
			
				var url_plot = 'https://' + window.location.hostname + '/cgi-bin/polymorphism-cgi//validation_variation/dude_json.pl?project=' + project_name + '&patient=' + patient_name + '&chr=' + chr_name;
				$.getJSON( url_plot, function( datas ) {
					PlotValuesChr_json(datas.items, div_id);
					newDiv.style.height = "400px";
					var newSpan = document.createElement('span');
					newSpan.innerHTML = "<br><center><span style='color:red;'><b>" + patient_name + "<br></span><span style='color:blue;'>Chr " + chr_name + "</span><br></center>";
					newDiv.appendChild(newSpan);
			    }).fail(function() { newSpan.innerHTML = "<br><center><span style='color:red;'><b>ERROR"; });
			}

			function PlotValuesChr_json(items, div_plot_id) {
				var trio;
				var tabPosR;
				var tabRatio;
				var tabRX;
				var tabRY;
				var tabplotRX = [0, 0];
				var tabdelRX = [];
				var tabdupRX = [];
				var tabplotRY = [-1, 1];
				var tabdelRY = [];
				var tabdupRY = [];
				if (items.FY.NO_DATA ==1) { return; }
				tabplotRY = items.FY.all;
				tabdupRY = items.FY.dup;
				tabdelRY = items.FY.del;

				var trace1 = {
					x: items.FX.all,
					y: tabplotRY,
					yaxis: 'y1',
					mode: 'markers',
					showlegend: false,
					name: ' ',
					marker: {
						color: "#E0B589",
						size: 2
					}
				};

				var trace2 = {
					x: items.FX.dup,
					y: tabdupRY,
					yaxis: 'y1',
					mode: 'markers',
					showlegend: false,
					name: ' ',
					marker: {
						color: "#0050EF",
						size: 4
					}
				};
	
				var trace3 = {
					x: items.FX.del,
					y: tabdelRY,
					yaxis: 'y1',
					mode: 'markers',
					showlegend: false,
					name: ' ',
					marker: {
						color: '#FF0097',
						size: 4
					}
				};
	
				var trace1F = {
					x: items.FX.all,
					y: items.FY.all_father,
					yaxis: 'y2',
					mode: 'markers',
					showlegend: false,
					name: ' ',
					marker: {
						color: '#DEEAEE',
						size: 2
					}
				};
	
				var trace2F = {
					x:  items.FX.dup,
					y: items.FY.dup_father,
					yaxis: 'y2',
					mode: 'markers',
					showlegend: false,
					name: ' ',
					marker: {
						color: "#1BA1E2",
						size: 3
					}
				};
	
				var trace3F = {
					x: items.FX.del,
					y: items.FY.del_father,
					yaxis: 'y2',
					mode: 'markers',
					showlegend: false,
					name: ' ',
					marker: {
						color: '#1BA1E2',
						size: 3
					}
				};
				
				var trace1M = {
					x: items.FX.all,
					y: items.FY.all_mother,
					yaxis: 'y3',
					mode: 'markers',
					showlegend: false,
					name: ' ',
					marker: {
						color: '#F5D6C6',
						size: 2
					}
				};
	
				var trace2M = {
					x:  items.FX.dup,
					y: items.FY.dup_mother,
					yaxis: 'y3',
					mode: 'markers',
					showlegend: false,
					name: ' ',
					marker: {
						color: "#D80073",
						size: 3
					}
				};
	
				var trace3M = {
					x: items.FX.del,
					y: items.FY.del_mother,
					yaxis: 'y3',
					mode: 'markers',
					showlegend: false,
					name: ' ',
					marker: {
						color: '#D80073',
						size: 3
					}
				};
				
				if (items.FY.all_mother.length == 0){
					data = [trace1, trace2, trace3];
					layout = {
						yaxis1: {
							automargin: true,
							range: [-1.5, 1.5],
							domain:[0,1],
							title: {
								text:patient,
								font: {family: 'Verdana',size: 8,color: 'black'}
							}
						},
						margin: { l:1, r:1, b:0, t:0, pad:0 },
						xaxis: {
							title: {
								text: '',
								font: {family: 'Courier New, monospace',size: 10,color: '#7f7f7f'}
							},
						},
					};
				}
				else {
					data = [trace1, trace2, trace3, trace1F, trace2F, trace3F, trace1M, trace2M, trace3M];
					layout = {
						yaxis1: {
							automargin: true,
							range: [-1.5, 1.5],
							domain:[0,0.33],
							title: { text:patient, font: { family:'Verdana', size:8, color:'black' } } 
						},
						margin: {l: 1,r: 1,b: 0,t: 0,pad: 0 },
						yaxis2: { domain:[0.33,0.66],range: [-1.5,1.5], title:{ text:'Father' ,font: {family: 'Courier New, monospace',size: 10,color: 'blue'}}
						},
						yaxis3: {
							domain:[0.66,1],
							range: [-1.5,1.5],
							title: {
								text:'Mother',
								font: {family: 'Courier New, monospace',size: 10,color: 'pink'}
							}
						},
						xaxis: {
							title: {
								text: '',font: {family: 'Courier New, monospace',size: 10,color: '#7f7f7f'}
							},
						},
					};
				}
				var config = { modeBarButtonsToRemove: ['pan2d', 'zoomIn2d', 'zoomOut2d', 'autoScale2d', 'toggleSpikelines', 'hoverClosestCartesian', 'hoverCompareCartesian'], displayModeBar: true };
				Plotly.newPlot(div_plot_id, data, layout, config);
			}
			
		</script>
