<script>

function escapeHTML(str) {
    return String(str ?? '').replace(/[&<>"']/g, function(c) {
        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c];
    });
}

// Compare reference and sequence position by position.
// Assumes both sequences have the same length and are aligned.
function compareSequences(reference, sequence, grnaStart = 12, grnaLength = 20) {

    reference = String(reference || '');
    sequence = String(sequence || '');
    let refHTML = '';
    let seqHTML = '';

    const maxLength = Math.max(reference.length, sequence.length);

    for (let i = 0; i < maxLength; i++) {

        const r = reference[i] || '-';
        const s = sequence[i] || '-';

        const inGuide = i >= grnaStart - 1 &&
                       i < grnaStart - 1 + grnaLength;
		const inPam  = i >= grnaStart - 1 + grnaLength &&
					                         i < grnaStart - 1 + grnaLength +3;
        const different = r !== s;

        let refClass = '';
        let seqClass = '';
		if (inPam) {
			refClass += ' pam';
			 seqClass += ' pam';
		}
        if (inGuide) {
            refClass += ' grna';
            seqClass += ' grna';
        }

        if (different) {
            refClass += ' seq-ref';
            seqClass += ' seq-diff';
        }

        refHTML += `<span class="${refClass.trim()}">${escapeHTML(r)}</span>`;
        seqHTML += `<span class="${seqClass.trim()}">${escapeHTML(s)}</span>`;
    }

    return `
        <div class="sequence-line">
            <b>Ref:</b> ${refHTML}
        </div>
        <div class="sequence-line">
            <b>Seq:</b> ${seqHTML}
        </div>
    `;
}

function generateTable(data) {

    const table = document.getElementById('resultTable');
    const thead = table.querySelector('thead');
    const tbody = table.querySelector('tbody');

    const patients = data.patients || [];
    const rows = data.rows || [];

    // Header
	let header = `
	    <tr>
	        <th>chr</th>
	        <th>start</th>
	        <th>end</th>
			<th>strand</th>
			<th>grna</th>
	        <th>nb_sample</th>
	        <th>UCSC</th>
	`;

    patients.forEach(patient => {
        header += `<th>${escapeHTML(patient)}</th>`;
    });

    header += `
            <th>reference / sequence</th>
            <th>annotations</th>
        </tr>
    `;

    thead.innerHTML = header;

    // Rows
    tbody.innerHTML = '';
    rows.forEach(row => {

        let html = `
            <tr>
                <td>${escapeHTML(row.chr)}</td>
                <td>${escapeHTML(row.start)}</td>
                <td>${escapeHTML(row.end)}</td>
				<td>${escapeHTML(row.strand)}</td>
				<td>${escapeHTML(row.grna)}</td>
                <td>${escapeHTML(row.nb_sample)}</td>
        `;
		
		const ucscUrl =
		    'https://genome.ucsc.edu/cgi-bin/hgTracks?db='+row.genome+'&position=' +
		    encodeURIComponent(row.chr + ':' + row.start + '-' + row.end);

		html += `
		    <td>
		        <a href="${ucscUrl}" target="_blank" rel="noopener">
		            UCSC
		        </a>
		    </td>
		`;

        (row.patients || []).forEach(value => {
            html += `<td>${escapeHTML(value)}</td>`;
        });
        html += `
            <td class="sequence-cell">
                ${compareSequences(row.reference, row.sequence)}
            </td>
            <td class="annotations">
                ${escapeHTML(row.annotations)}
            </td>
        `;

        html += '</tr>';

        tbody.insertAdjacentHTML('beforeend', html);
    });

    document.getElementById('status').textContent =
        rows.length + ' sequences found';
}
