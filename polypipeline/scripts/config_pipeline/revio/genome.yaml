steps:
  - pbmm2
  - deepvariant
  - binary_depth
  - sawfish
  - wisecondor
  - spectre
  - hificnv
  - calling_wisecondor



project_steps:
  - deepvariant_denovo

scripts:
  pbmm2:
    script: "pacbio/pbmm2.pl -force=1"

  deepvariant:
    script: "pacbio/deepvariant.pl"
    previous: pbmm2

  binary_depth:
    script: "coverage_genome.pl"
    previous: pbmm2

  sawfish:
    script: "pacbio/sawfish.pl"
    previous: pbmm2

  wisecondor:
    script: "pacbio/wisecondor.pl"
    previous: pbmm2

  calling_wisecondor:
    script: "pacbio/calling_wisecondor.pl"
    previous: wisecondor

  spectre:
    script: "pacbio/spectre.pl"
    previous: pbmm2

  hificnv:
    script: "pacbio/hificnv.pl"
    previous: pbmm2

  deepvariant_denovo:
    script: "deepvariant/deepvariant_denovo.pl"
    previous: deepvariant